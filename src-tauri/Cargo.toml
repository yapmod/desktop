[package]
name = "yapmod-desktop"
version = "1.2.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.26"
base64 = "0.22"
minisign-verify = "0.3"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12", features = ["unstable", "tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.8"
tauri-plugin-updater = "2.14"
tempfile = "3"
tokio = { version = "1", features = ["sync", "macros", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebViewConfiguration", "WKPreferences", "WKUIDelegate", "WKWebView"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"

[features]
custom-protocol = ["tauri/custom-protocol"]
