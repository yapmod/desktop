name: Publish desktop plugin

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: desktop-plugins-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test
      - name: Sign the plugin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          YAPMOD_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          cp runtime/plugins/desktop.js desktop-plugins.js
          pnpm tauri signer sign desktop-plugins.js
          python3 scripts/release.py verify desktop-plugins.js
      - name: Refresh the plugin channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=plugins-v1
          echo "Desktop plugin API v1, built from ${GITHUB_SHA}." > plugin-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" desktop-plugins.js desktop-plugins.js.sig --clobber
            gh release edit "$tag" --notes-file plugin-notes.md --prerelease --latest=false
          else
            gh release create "$tag" desktop-plugins.js desktop-plugins.js.sig --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Desktop plugin v1" --notes-file plugin-notes.md
          fi
