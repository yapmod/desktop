name: Release desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Approved stable release tag (vX.Y.Z); also used for retries"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    # GitHub only exposes draft releases to tokens with repository write access.
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Validate stable tag
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved source and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release.py notes "$RELEASE_TAG" > /dev/null
          python3 -c 'import json, os; assert "v" + json.load(open(".release-please-manifest.json"))["."] == os.environ["RELEASE_TAG"]'
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > state.json
          jq -e '.isPrerelease == false' state.json > /dev/null
          echo "publish=$(jq -r .isDraft state.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            bundles: app
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Add both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          # Keep the runner's Ubuntu archive and security mirrors when Azure downloads stall.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libfuse2 patchelf xdg-utils \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-pulseaudio gstreamer1.0-libav
          for element in webrtcbin nicesrc opusdec vp8dec pulsesink; do gst-inspect-1.0 "$element" >/dev/null; done
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build packages
        env:
          YAPMOD_RELEASE_REPO: ${{ github.repository }}
          YAPMOD_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          : "${TAURI_SIGNING_PRIVATE_KEY:?Configure the signing key in GitHub Actions secrets}"
          python scripts/release.py config "$RELEASE_TAG" ci-updater.json
          pnpm tauri build --ci --target "$TARGET" --bundles "$BUNDLES" --config ci-updater.json -- --locked
      - name: Create the styled disk image
        if: runner.os == 'macOS'
        run: |
          python -m pip install dmgbuild==2.0.0
          bundle="src-tauri/target/$TARGET/release/bundle"
          image="$bundle/dmg/Yapmod-Desktop-universal.dmg"
          python scripts/release-dmg.py "$bundle/macos/Yapmod Desktop.app" "$image"
          mounted="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mounted" "$image"
          trap 'hdiutil detach "$mounted"' EXIT
          codesign --verify --strict --deep "$mounted/Yapmod Desktop.app"
      - name: Collect installers and update signatures
        run: |
          shopt -s nullglob
          mkdir deliverables
          dir="src-tauri/target/$TARGET/release/bundle"
          for file in "$dir"/dmg/*.dmg "$dir"/macos/*.app.tar.gz{,.sig} "$dir"/nsis/*-setup.exe{,.sig} "$dir"/appimage/*.AppImage{,.sig} "$dir"/deb/*.deb{,.sig}; do
            name="$(basename "$file")"
            cp "$file" "deliverables/${name// /-}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: deliverables/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    outputs:
      published: ${{ steps.publish.outputs.published }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: deliverables
          merge-multiple: true
      - name: Verify every update and assemble the manifest
        env:
          YAPMOD_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/release.py manifest deliverables "$RELEASE_TAG"
          python3 scripts/release.py notes "$RELEASE_TAG" > release-notes.md
      - name: Publish the complete desktop release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          gh release view "$tag" --json isDraft > state.json
          if ! jq -e '.isDraft' state.json > /dev/null; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release upload "$tag" deliverables/* --clobber
          latest_tag="$(gh release view --json tagName --jq .tagName)"
          export LATEST_TAG="$latest_tag"
          make_latest="$(python3 -c 'import os; version=lambda s: tuple(map(int,s.removeprefix("v").split("."))); print(str(version(os.environ["RELEASE_TAG"]) >= version(os.environ["LATEST_TAG"])).lower())')"
          release_id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          gh api --silent --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest="$make_latest" -F body=@release-notes.md
          echo 'published=true' >> "$GITHUB_OUTPUT"

  announce:
    permissions:
      contents: write
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/announce-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      YAPIN_RELEASE_WEBHOOK_URL: ${{ secrets.YAPIN_RELEASE_WEBHOOK_URL }}
