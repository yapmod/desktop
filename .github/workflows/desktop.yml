name: Desktop

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            bundles: app
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Add both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libfuse2 patchelf xdg-utils \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-pulseaudio gstreamer1.0-libav
          for element in webrtcbin nicesrc opusdec vp8dec pulsesink; do gst-inspect-1.0 "$element" >/dev/null; done
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build packages
        env:
          YAPMOD_RELEASE_REPO: ${{ github.ref_type == 'tag' && github.repository || '' }}
          YAPMOD_UPDATER_PUBLIC_KEY: ${{ github.ref_type == 'tag' && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          flags=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            : "${TAURI_SIGNING_PRIVATE_KEY:?Configure the signing key in GitHub Actions secrets}"
            python scripts/release.py config "$GITHUB_REF_NAME" ci-updater.json
            flags+=(--config ci-updater.json)
          else
            unset YAPMOD_RELEASE_REPO YAPMOD_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npm run tauri -- build --ci --target "$TARGET" --bundles "$BUNDLES" "${flags[@]}" -- --locked
      - name: Create the styled disk image
        if: runner.os == 'macOS'
        run: |
          python -m pip install dmgbuild==2.0.0
          bundle="src-tauri/target/$TARGET/release/bundle"
          image="$bundle/dmg/Yapmod-Desktop-universal.dmg"
          python scripts/release-dmg.py "$bundle/macos/Yapmod Desktop.app" "$image"
          mounted="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mounted" "$image"
          trap 'hdiutil detach "$mounted"' EXIT
          codesign --verify --strict --deep "$mounted/Yapmod Desktop.app"
      - name: Collect installers and update signatures
        run: |
          shopt -s nullglob
          mkdir deliverables
          dir="src-tauri/target/$TARGET/release/bundle"
          for file in "$dir"/dmg/*.dmg "$dir"/macos/*.app.tar.gz{,.sig} "$dir"/nsis/*-setup.exe{,.sig} "$dir"/appimage/*.AppImage{,.sig} "$dir"/deb/*.deb{,.sig}; do
            name="$(basename "$file")"
            cp "$file" "deliverables/${name// /-}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: deliverables/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: deliverables
          merge-multiple: true
      - name: Verify every update and assemble the manifest
        env:
          YAPMOD_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/release.py manifest deliverables "$GITHUB_REF_NAME"
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish the complete desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft > state.json 2>/dev/null; then
            jq -e '.isDraft' state.json >/dev/null || { echo "Release $tag is already public"; exit 1; }
          else
            gh release create "$tag" --verify-tag --draft --title "Yapmod Desktop $tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" deliverables/* --clobber
          release_id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          gh api --silent --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=legacy -F body=@release-notes.md
