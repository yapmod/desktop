name: Checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format and test
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Install native test dependencies
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/check-changelog.mjs
        if: github.event_name != 'push'
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - run: pnpm test
